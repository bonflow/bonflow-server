# On-premise deployment in the venue LAN: app + PostgreSQL + reverse proxy.
# Copy .env.example to .env and fill in the secrets first.
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bonflow
      POSTGRES_USER: bonflow
      POSTGRES_PASSWORD: ${BONFLOW_DB_PASSWORD:?set BONFLOW_DB_PASSWORD}
    volumes:
      # PostgreSQL 18 images keep version-specific data below /var/lib/postgresql
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bonflow -d bonflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      BONFLOW_DB_URL: jdbc:postgresql://db:5432/bonflow
      BONFLOW_DB_USER: bonflow
      BONFLOW_DB_PASSWORD: ${BONFLOW_DB_PASSWORD:?set BONFLOW_DB_PASSWORD}
      BONFLOW_JWT_SECRET: ${BONFLOW_JWT_SECRET:?set BONFLOW_JWT_SECRET (>= 32 bytes)}
      BONFLOW_ADMIN_USERNAME: ${BONFLOW_ADMIN_USERNAME:-admin}
      BONFLOW_ADMIN_PASSWORD: ${BONFLOW_ADMIN_PASSWORD:?set BONFLOW_ADMIN_PASSWORD}
      BONFLOW_STATION_USERNAME: ${BONFLOW_STATION_USERNAME:-station}
      BONFLOW_STATION_PASSWORD: ${BONFLOW_STATION_PASSWORD:-}
      TZ: ${TZ:-Europe/Zurich}

  # Daily database dumps into ./backups, 14 days kept (see docs/backup.md).
  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: bonflow
      PGDATABASE: bonflow
      PGPASSWORD: ${BONFLOW_DB_PASSWORD:?set BONFLOW_DB_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${BONFLOW_BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_DAYS: ${BONFLOW_BACKUP_KEEP_DAYS:-14}
      TZ: ${TZ:-Europe/Zurich}
    entrypoint: ["sh", "/backup.sh"]
    volumes:
      - ./backups:/backups
      - ./docker/backup/backup.sh:/backup.sh:ro

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  db-data:
  caddy-data:
