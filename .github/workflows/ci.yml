name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Testcontainers (PostgreSQL) needs Docker, which ubuntu-latest provides.
      - name: Build and test
        run: mvn -B verify
      # The OpenAPI spec is the contract with bonflow-app (written by ApplicationSmokeTest).
      - name: Publish OpenAPI spec
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openapi
          path: target/openapi.json
          if-no-files-found: error
