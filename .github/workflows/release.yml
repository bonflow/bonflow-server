name: release
# Push a tag like v0.1.0 to build, test and publish a release:
# a GitHub release with the OpenAPI spec and the Docker image ghcr.io/bonflow/bonflow-server.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp target/openapi.json "openapi-${TAG}.json"
          gh release create "$TAG" "openapi-${TAG}.json" \
            --title "$TAG" --generate-notes --verify-tag

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set version from tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "25"
      - name: Stamp the version into the pom
        run: mvn -B -q versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/bonflow/bonflow-server:${{ env.VERSION }}
            ghcr.io/bonflow/bonflow-server:latest

  # After a release, move the pom on main to the next patch snapshot (v0.1.3 -> 0.1.4-SNAPSHOT)
  # through a pull request. The image job stamps the real version from the tag, so this only
  # keeps local builds and the "dev"/snapshot version in the UI footer honest.
  bump:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Open pull request with the next snapshot version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          released="${TAG#v}"
          IFS=. read -r major minor patch <<< "${released%%-*}"
          next="${major}.${minor}.$((patch + 1))-SNAPSHOT"
          current="$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)"
          if [ "$current" = "$next" ]; then
            echo "pom is already at $next"
            exit 0
          fi
          branch="chore/next-version-${next}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          mvn -B -q versions:set -DnewVersion="$next" -DgenerateBackupPoms=false
          git commit -am "Next development version ${next}"
          git push origin "$branch"
          if ! gh pr create --base main --head "$branch" \
            --title "Next development version ${next}" \
            --body "Automatically created after release ${TAG}."; then
            # Creating PRs from workflows can be disabled by the organization: leave the branch
            # and point to the compare page instead of failing the release.
            link="https://github.com/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
            echo "::warning::Could not open the pull request, open it manually: ${link}"
            echo "Open the pull request for ${next}: ${link}" >> "$GITHUB_STEP_SUMMARY"
          fi
