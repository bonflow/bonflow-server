name: release
# Push a tag like v0.1.0 to build, test and publish a release:
# a GitHub release with the OpenAPI spec and the Docker image ghcr.io/bonflow/bonflow-server.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp target/openapi.json "openapi-${TAG}.json"
          gh release create "$TAG" "openapi-${TAG}.json" \
            --title "$TAG" --generate-notes --verify-tag

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set version from tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "25"
      - name: Stamp the version into the pom
        run: mvn -B -q versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/bonflow/bonflow-server:${{ env.VERSION }}
            ghcr.io/bonflow/bonflow-server:latest
