spring:
  application:
    name: bonflow-server
  datasource:
    url: ${BONFLOW_DB_URL:jdbc:postgresql://localhost:5432/bonflow}
    username: ${BONFLOW_DB_USER:bonflow}
    password: ${BONFLOW_DB_PASSWORD:bonflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  modulith:
    events:
      # Event publication registry = transactional outbox. Incomplete publications are
      # re-submitted on restart so print jobs / display pushes are never lost.
      republish-outstanding-events-on-restart: true
      jdbc:
        # The registry table is created by Modulith itself (JDBC starter), not by Flyway.
        schema-initialization:
          enabled: true
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true # RFC 9457 Problem Details for errors

server:
  port: 8080
  forward-headers-strategy: framework # behind Caddy/nginx

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  paths-to-match: /api/**

bonflow:
  security:
    # HS256 signing key for access tokens, at least 32 bytes. No default on purpose.
    jwt-secret: ${BONFLOW_JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    # Bootstrap accounts; accounts in the database (admin UI: Konten) are checked first.
    bootstrap-admin-username: ${BONFLOW_ADMIN_USERNAME:admin}
    bootstrap-admin-password: ${BONFLOW_ADMIN_PASSWORD:}
    # Shared login of the station displays (role STATION); disabled while the password is blank.
    station-username: ${BONFLOW_STATION_USERNAME:station}
    station-password: ${BONFLOW_STATION_PASSWORD:}
  printing:
    # Tickets are sent by a worker every poll-interval; failed jobs are retried with backoff.
    poll-interval: 2s
    connect-timeout: 3s
    write-timeout: 5s
    zone: Europe/Zurich
