name: label-sync
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"   # weekly, Monday
permissions:
  contents: read
  issues: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: EndBug/label-sync@52074158190acb45f3077f9099fea818aa43f97a # v2
        with:
          config-file: https://raw.githubusercontent.com/bonflow/.github/main/labels.yml
          token: ${{ secrets.GITHUB_TOKEN }}
          delete-other-labels: false
